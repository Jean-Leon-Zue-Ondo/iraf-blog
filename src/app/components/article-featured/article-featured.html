<div class="article-featured">
  <div class="article-img-placeholder">
    <svg width="120" height="120" viewBox="0 0 100 100" style="opacity:0.2;">
      <path d="M50 10 C80 10,90 40,90 60 C90 80,70 90,50 90 C30 90,10 80,10 60 C10 40,20 10,50 10Z" fill="white"/>
      <line x1="50" y1="10" x2="50" y2="90" stroke="white" stroke-width="2"/>
      <line x1="50" y1="35" x2="72" y2="58" stroke="white" stroke-width="1.5"/>
      <line x1="50" y1="50" x2="28" y2="67" stroke="white" stroke-width="1.5"/>
    </svg>
    <span class="article-img-tag">Agronomie</span>
  </div>
  <div class="article-body">
    <div>
      <span class="article-tag">{{ article.tag }}</span>
      <h3 class="article-title">{{ article.title }}</h3>
      <p class="article-excerpt">{{ article.excerpt }}</p>
    </div>
    <div>
      <div class="article-meta">
        <span>{{ article.author }}</span>
        <span class="meta-dot"></span>
        <span>{{ article.date }}</span>
        <span class="meta-dot"></span>
        <span>{{ article.readTime }}</span>
      </div>
      <a href="#" class="read-more">Lire l'article complet →</a>
    </div>
  </div>
</div>
