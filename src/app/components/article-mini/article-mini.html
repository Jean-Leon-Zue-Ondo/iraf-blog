<a href="#" class="article-mini">
  <span class="mini-num">{{ numLabel }}</span>
  <div class="mini-content">
    <div class="mini-tag">{{ article.tag }}</div>
    <div class="mini-title">{{ article.title }}</div>
    <div class="mini-meta">{{ article.author }} · {{ article.date }} · {{ article.readTime }}</div>
  </div>
</a>
