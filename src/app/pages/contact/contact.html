<div class="page-container">
  <div class="page-header">
    <div class="page-eyebrow">Prenons contact</div>
    <h1 class="page-title">Nous contacter</h1>
    <p class="page-desc">Pour toute question, collaboration ou demande d'information, n'hésitez pas à nous écrire.</p>
  </div>

  <div class="contact-grid">
    <div class="contact-info">
      <div class="info-item">
        <div class="info-label">Adresse</div>
        <div class="info-value">Libreville, Gabon</div>
      </div>
      <div class="info-item">
        <div class="info-label">Email</div>
        <a href="mailto:contact@iraf.ga" class="info-value info-link">contact&#64;iraf.ga</a>
      </div>
      <div class="info-item">
        <div class="info-label">Téléphone</div>
        <a href="tel:+24100000000" class="info-value info-link">+241 00 00 00 00</a>
      </div>
    </div>

    <form class="contact-form">
      <div class="form-group">
        <label class="form-label">Nom complet</label>
        <input class="form-input" type="text" placeholder="Votre nom" />
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" placeholder="votre&#64;email.com" />
      </div>
      <div class="form-group">
        <label class="form-label">Message</label>
        <textarea class="form-input form-textarea" placeholder="Votre message..."></textarea>
      </div>
      <button class="form-btn" type="submit">Envoyer le message</button>
    </form>
  </div>
</div>
